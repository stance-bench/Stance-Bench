[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stancebench"
version = "0.2.0"
description = "Individual stance prediction with explicit personal evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
model = ["torch>=2.6", "transformers>=4.56,<6", "accelerate>=0.26"]

[project.scripts]
stancebench = "stancebench.cli:main"

[tool.setuptools.packages.find]
include = ["stancebench*"]
